{% extends 'base.html' %}

{% block title %}Eliminar combo · {{ combo.name }} - MixLab{% endblock %}

{% block content %}
<div class="container my-5" style="max-width: 560px;">
  <div class="card border-0 shadow-sm">
    <div class="card-body p-4">
      <h1 class="h5 fw-bold">Eliminar combo</h1>
      <p class="mb-3">
        ¿Seguro que quieres eliminar el combo <strong>{{ combo.name }}</strong>?
        Esta acción no se puede deshacer.
      </p>
      <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-danger">Sí, eliminar</button>
          <a href="{% url 'store:inventory_combo_detail' combo.id %}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
