{% for week in calendar_weeks %}
  {% for day in week %}
  <div class="combo-cal-day {% if not day.in_month %}out{% endif %} {% if day.is_today %}today{% endif %} {% if day.bookings %}has-events{% endif %}">
    <div class="combo-cal-daynum d-flex justify-content-between align-items-center gap-1">
      <span>{{ day.date.day }}</span>
      {% if day.bookings and day.in_month %}
      <span class="d-inline-flex gap-1">
        <a class="combo-day-pdf"
           href="{% url 'store:inventory_combo_day_summary_pdf' combo.id %}?date={{ day.date|date:'Y-m-d' }}&download=1"
           target="_blank"
           rel="noopener"
           title="Descargar resumen del día"
           onclick="event.stopPropagation();">
          <i class="bi bi-download"></i>
        </a>
        <a class="combo-day-pdf js-day-sheet"
           href="{% url 'store:inventory_combo_day_sheet' combo.id %}?date={{ day.date|date:'Y-m-d' }}"
           title="Ver la hoja del día por departamento">
          <i class="bi bi-table"></i>
        </a>
      </span>
      {% endif %}
    </div>
    {% for b in day.bookings %}
    <button type="button"
            class="combo-event-chip{% if day.date < today %} is-past{% endif %}{% if b.needs_confirm %} needs-confirm{% endif %}"
            data-booking-id="{{ b.id }}"
            style="background:{{ b.dept_color|default:'#64748b' }};"
            title="{% if b.needs_confirm %}Por confirmar, sin abono · {% endif %}{{ b.dept_name|default:'Sin departamento' }} · {{ b.display_client_name|default:b.client_name }} · {% if b.location_text %}{{ b.location_text }}{% else %}Sin lugar{% endif %}">
      {% if b.needs_confirm %}
      <span class="chip-warn" aria-hidden="true"><i class="bi bi-exclamation-triangle-fill"></i></span>
      {% endif %}
      <span class="chip-time">
        {% if b.event_time %}{{ b.event_time|time:"H:i" }}{% else %}Sin hora{% endif %}
      </span>
      <span class="chip-place">
        {% if b.location_text %}{{ b.location_text|truncatechars:28 }}{% else %}Sin lugar{% endif %}
      </span>
      <span class="chip-dept">{{ b.dept_name|default:"Sin depto" }}</span>
      {% for machine in b.machine_lines %}
      <span class="chip-machine">{{ machine.quantity }} × {{ machine.label }}</span>
      {% endfor %}
    </button>
    {% endfor %}
  </div>
  {% endfor %}
{% endfor %}
